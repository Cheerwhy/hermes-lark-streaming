name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    env:
      HERMES_DISABLE_LAZY_INSTALLS: '1'
    strategy:
      matrix:
        hermes:
          - e06df9c2eae6901f4c88f464e0ae6e753c0428b8 # v0.22.0 minimum
          - bf0203a794a07aac3ff764972ab9087baa4e4f4e # v0.22.5
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: .hermes-test-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0, same as Hermes
      - name: Install Hermes and plugin in isolated environment
        run: |
          # Honor the host lockfile and dependency overrides (including Pillow/browser-harness).
          uv sync --project ../.hermes-test-source --frozen --no-dev --python 3.14
          uv pip install --python ../.hermes-test-source/.venv/bin/python -e '.[dev]' build
          echo "$GITHUB_WORKSPACE/.hermes-test-source/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint and type check
        run: |
          python -m ruff check hermes_lark_streaming tests scripts __init__.py
          python -m mypy hermes_lark_streaming scripts
      - name: Native platform and rendering tests
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
        run: python -m pytest tests -q
      - name: Native interface and manifest verification
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
        run: |
          python -m hermes_lark_streaming verify
          python - <<'PY'
          import json
          from pathlib import Path
          from hermes_cli.plugin_validate import validate_plugin_dir
          report = validate_plugin_dir(Path.cwd())
          print(json.dumps(report.to_dict(), indent=2))
          raise SystemExit(report.exit_code)
          PY
      - name: Build distribution
        run: python -m build
